<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>엠케이아틀라스 서점</title>
  <meta name="description" content="역사 · 철학 · 과학 · 정치 아틀라스의 자료실 시리즈가 한 권씩 책이 된 숲속 오두막 독립서점. 숨어서 읽는 자리, 루프탑, 캠핑장, 숲속 영화관, 계곡과 바닷가가 있어요." />
  <meta name="theme-color" content="#e9dcc6" />
  <meta property="og:title" content="엠케이아틀라스 서점" />
  <meta property="og:description" content="숲속 오두막 독립서점. 책장 사이 막다른 골목, 다락 구석, 나무 위 오두막에 숨어서 읽어요." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://atlasmkhz.github.io/mkhz-bookshop/" />
  <meta property="og:image" content="https://atlasmkhz.github.io/mkhz-bookshop/assets/hero/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="숲속 통나무 독립서점 모형 — 루프탑 유리 방과 전구 줄, 창마다 책장, 현관 계단에 앉은 노란 고양이" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://atlasmkhz.github.io/mkhz-bookshop/assets/hero/og.jpg" />
  <link rel="preload" as="image" href="assets/hero/hero-small.webp" media="(max-width: 819px)" />
  <link rel="preload" as="image" href="assets/hero/hero.webp" media="(min-width: 820px)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": {
        "three": "./vendor/three/three.module.js",
        "three/addons/": "./vendor/three/addons/"
    } }
  </script>
  <script src="vendor/peerjs/peerjs.min.js" defer></script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="loading"><span>서점 문을 여는 중…</span></div>

  <!-- 입장 -->
  <div id="entry">
    <form id="enterForm" class="panel" autocomplete="off">
      <img class="hero-band" src="assets/hero/hero-small.webp" alt="숲속 통나무 독립서점 모형 — 루프탑 유리 방과 전구 줄, 창마다 책장, 현관 계단에 앉은 노란 고양이" width="900" height="506" decoding="async" />
      <div class="logo">엠케이아틀라스 <span>서점</span></div>
      <p class="sub">숲속 오두막 독립서점. 책장 골목과 비밀 서재, 루프탑,<br />캠핑장과 숲속 영화관, 계곡을 지나면 바닷가까지.</p>
      <label class="field">
        <span>닉네임</span>
        <input id="nameInput" maxlength="12" placeholder="서점에서 쓸 이름" enterkeyhint="go" />
      </label>
      <div class="look-box">
        <canvas id="lookPreview" class="look-preview" width="180" height="230" aria-label="내 모습 미리 보기"></canvas>
        <div class="look-fields">
          <div class="field"><span>윗옷</span><div id="topSwatches" class="swatches"></div></div>
          <div class="field"><span>아래옷</span><div id="bcSwatches" class="swatches"></div></div>
          <div class="field"><span>머리</span><div id="hairSwatches" class="swatches"></div></div>
          <div class="field"><span>피부</span><div id="skinSwatches" class="swatches"></div></div>
        </div>
      </div>
      <div class="field"><span>머리형</span><div id="hsChips" class="chips"></div></div>
      <div class="field"><span>아래옷</span><div id="btChips" class="chips"></div></div>
      <div class="field"><span>소품</span><div id="acChips" class="chips"></div></div>
      <div class="field hidden" id="roomField"><span>방</span>
        <select id="roomSelect"><option value="">빈자리 있는 방으로</option></select>
      </div>
      <label class="check"><input type="checkbox" id="soundOnEnter" checked /> 음악 · 장작 · 책장 소리와 함께</label>
      <button class="btn primary big" type="submit">서점 문 열고 들어가기</button>
      <p class="tiny" id="entryInfo">가입 없이 닉네임만 · 같은 시간에 온 손님들과 함께 보여요</p>
    </form>
  </div>

  <!-- 화면 위 UI -->
  <div id="hud" class="hidden">
    <div class="topbar">
      <div class="chip brand"><b>MK 서점</b><em id="roomNo"></em><i id="statusDot" class="dot"></i><span id="count">혼자 머무는 중</span></div>
      <div class="buttons">
        <button id="btnLook" class="round" title="디오라마 화면 켜기 · 끄기" type="button" aria-label="디오라마 화면">🎞️</button>
        <button id="btnMyCat" class="round" title="우리 집 고양이 입장시키기" type="button" aria-label="우리 집 고양이">🐾</button>
        <button id="btnRain" class="round off" title="빗소리" type="button" aria-label="빗소리">☔</button>
        <button id="btnNight" class="round" title="낮 · 밤" type="button" aria-label="낮 밤 바꾸기">☀️</button>
        <button id="btnMusic" class="round" title="배경 음악 끄기" type="button" aria-label="배경 음악">🎵</button>
        <button id="btnSound" class="round off" title="소리 켜기" type="button" aria-label="소리">🔈</button>
      </div>
    </div>
    <div id="hint" class="hint"></div>
    <div id="toast" class="toast"></div>
    <div id="card" class="card">
      <button id="cardClose" class="x" type="button" aria-label="닫기">×</button>
      <div id="cardBody"></div>
    </div>
    <div id="chatLog" class="chat-log"></div>
    <div id="spaceTag" class="space-tag"></div>
    <form id="chatBar" class="chat-bar hidden" autocomplete="off">
      <input id="chatInput" maxlength="80" placeholder="가까이 있는 사람에게만 보여요" enterkeyhint="send" />
      <button class="btn primary" type="submit">말하기</button>
    </form>
    <div class="bottombar">
      <button id="btnBasket" class="tab" type="button"><span class="ico">🧺</span><span>책바구니</span><i id="basketCount" class="badge hidden">0</i></button>
      <button id="btnChat" class="tab" type="button"><span class="ico">💬</span><span>말하기</span></button>
      <button id="btnDrink" class="tab" type="button"><span class="ico">☕</span><span>음료</span></button>
      <button id="btnWave" class="tab" type="button"><span class="ico">👋</span><span>인사</span></button>
      <button id="btnDance" class="tab" type="button"><span class="ico">💃</span><span>춤추기</span></button>
      <button id="btnPlaces" class="tab" type="button"><span class="ico">🧭</span><span>가볼 곳</span></button>
    </div>
    <div id="player" class="player hidden">
      <div class="player-bar"><span id="playerTitle">상영 중</span><button id="playerSize" type="button">크게</button><button id="playerClose" type="button" aria-label="닫기">×</button></div>
      <iframe id="playerFrame" src="about:blank" title="숲속 영화관" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
    <button id="petBubble" class="pet-bubble" type="button">🤚 <span>쓰다듬기</span></button>
    <div id="fireBar" class="fire-bar" role="group" aria-label="모닥불">
      <button id="fireLog" type="button">🪵 <span>장작 넣기</span></button>
      <button id="fireGaze" type="button">🔥 <span>불멍</span></button>
    </div>
    <div id="gazeVeil" class="gaze-veil"></div>
    <button id="starChip" class="star-chip" type="button">🌌 별멍</button>
    <button id="copyChip" class="copy-chip" type="button">✍️ 필사하기</button>
    <div id="pairAsk" class="pair-ask panel" role="dialog" aria-label="같이 산책 청">
      <div id="paText" class="pa-text"></div>
      <div class="row"><button id="paYes" class="btn primary" type="button">🚶 같이 걷기</button><button id="paNo" class="btn ghost" type="button">다음에</button></div>
    </div>
    <div id="pairChip" class="pair-chip"><span id="pcText"></span><button id="pcStop" type="button" aria-label="같이 산책 그만두기">×</button></div>
    <button id="woodChip" class="copy-chip" type="button">🪵 나무 다듬기</button>
    <div id="clubPanel" class="club-panel panel" role="dialog" aria-label="독서 모임 방 단체 채팅">
      <div class="cl-head"><div><b>📚 독서 모임 방</b> <span id="clCount" class="cl-count">1/10</span></div><div class="cl-who" id="clWho"></div><button id="clCopy" class="cl-btn" type="button" title="대화 복사">📋</button><button id="clClose" class="x" type="button" aria-label="자리에서 일어나기">×</button></div>
      <div class="cl-topic" id="clTopic"></div>
      <div class="cl-list" id="clList"></div>
      <form id="clForm" class="cl-form" autocomplete="off"><input id="clInput" maxlength="80" placeholder="이 방 사람들에게만 보여요" enterkeyhint="send" /><button class="btn primary" type="submit">보내기</button></form>
    </div>
    <div id="craftPanel" class="craft-panel panel" role="dialog" aria-label="나무 다듬기">
      <button id="crClose" class="x" type="button" aria-label="그만하기">×</button>
      <div class="cr-tools" id="crTools"></div>
      <div class="cr-title"><b id="crTitle">톱질 · 판자 자르기</b> <span id="crCount" class="cr-count">0 / 24</span></div>
      <div class="cr-meter" aria-hidden="true"><i class="zone"></i><i id="crNeedle" class="needle"></i></div>
      <div class="cp-prog"><i id="crProg"></i></div>
      <div class="cr-row"><span id="crCombo" class="cr-combo">초록 칸에서 누르면 「좋아요!」 — 두 칸씩</span><button id="crHit" class="btn primary cr-hit" type="button">🪚 쓱싹</button></div>
      <div class="cr-chat" id="crChat"></div>
      <form id="crForm" class="cr-form" autocomplete="off"><input id="crInput" maxlength="80" placeholder="이 테이블 사람들에게 한마디" enterkeyhint="send" /><button class="btn" type="submit">말하기</button></form>
      <div class="cr-foot"><span id="crMade"></span><button id="crGaze" class="cr-link" type="button">👀 공방지기 구경 (목공 멍)</button></div>
    </div>
    <div id="copyPanel" class="copy-panel panel" role="dialog" aria-label="필사">
      <button id="cpClose" class="x" type="button" aria-label="필사 그만하기">×</button>
      <div class="cp-scroll">
      <div id="cpKicker" class="cp-kicker">✍️ 오늘의 필사</div>
      <div id="cpOrigin" class="cp-origin"></div>
      <div id="cpKo" class="cp-ko"></div>
      <div class="cp-src"><span id="cpSrc"></span> · <a id="cpLink" href="#" target="_blank" rel="noopener">철학아틀라스에서 보기 ↗</a></div>
      <div class="cp-prog"><i id="cpBar"></i></div>
      <div class="cp-step"><span id="cpStep">단락 1 / 5</span></div>
      <p id="cpPara" class="cp-para"></p>
      <textarea id="cpInput" class="cp-input" rows="3" placeholder="위 단락을 천천히 따라 써 보세요. 쓸 때마다 사각사각 소리가 나요." spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      <p id="cpQ" class="cp-q"></p>
      <div class="cp-row">
        <button id="cpMode" type="button">🎧 소리만 듣기</button>
        <button id="cpPrev" type="button">◀ 지난 편</button>
        <button id="cpToday" type="button">오늘 편</button>
        <button id="cpNext" type="button">다음 편 ▶</button>
        <button id="cpBook" type="button">📓 내 필사 공책</button>
      </div>
      </div>
    </div>
    <div id="gameBar" class="game-bar" role="status"><span id="gameText">🔍 숨은 아깽이 찾기</span><button id="gameStop" type="button">그만</button></div>
    <div id="gazeBar" class="gaze-bar" role="group" aria-label="불멍">
      <span id="gazeInfo" class="gaze-info">🔥 불멍 중</span>
      <button id="gazeLog" type="button">🪵 장작 넣기</button>
      <button id="gazeConst" type="button" style="display:none">✨ 별자리 끄기</button>
      <button id="gazeExit" type="button">나가기</button>
    </div>
  </div>

  <!-- 펼친 책 · 책바구니 · 음료 · 건의함 (아래에서 올라오는 판) -->
  <div id="sheet" class="sheet-wrap hidden">
    <div class="sheet panel" role="dialog" aria-modal="true">
      <button id="sheetClose" class="x" type="button" aria-label="닫기">×</button>
      <div id="sheetBody"></div>
    </div>
  </div>

  <noscript>이 서점은 자바스크립트가 필요해요.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
