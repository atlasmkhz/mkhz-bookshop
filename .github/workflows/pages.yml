# main 에 올린 것을 gh-pages 브랜치로 그대로 옮겨 GitHub Pages 에 내보냅니다.
# (GitHub Pages 설정: Settings → Pages → Branch: gh-pages / root)
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push -f origin HEAD:gh-pages
