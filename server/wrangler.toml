# 엠케이아틀라스 서점 방 서버 (Cloudflare Workers + Durable Objects)
name = "mkhz-bookshop"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# 방 하나에 들어갈 수 있는 최대 인원
ROOM_CAP = "100"
# 만들 수 있는 방 개수 (손님이 늘 있는 방 하나가 하루 종일 깨어 있으면 실행시간 한도의 약 83%를 씀 — README 참고)
MAX_ROOMS = "5"
# 말풍선이 전해지는 거리 (m). 화면에서는 9m 안쪽만 보여 줌
CHAT_RANGE = "12"
# 접속을 허용할 사이트 주소 (쉼표로 여러 개)
ALLOWED_ORIGINS = "https://atlasmkhz.github.io,http://localhost:8765,http://127.0.0.1:8765,http://localhost:8000"
# 건의함 열쇠(ADMIN_KEY)는 비밀값이라 여기 적지 않음 — GitHub 비밀값 ADMIN_KEY 를 넣으면 워크플로가 올려 줌

[[durable_objects.bindings]]
name = "ROOM"
class_name = "BookRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "BOX"
class_name = "Suggestions"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BookRoom", "Lobby", "Suggestions"]
