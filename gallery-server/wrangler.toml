# 엠케이아틀라스 서점 미술관 서버 (채팅 서버와 따로)
# - 사진 창고: R2 버킷 mkhz-gallery (Cloudflare 대시보드에서 R2 를 한 번 켜야 해요)
# - 자동 검사: Workers AI (무료 플랜 하루 쓸 수 있는 양 안에서)
# - 전시 · 대기열 · 하트 · 본 사람 · 신고: Durable Object 하나 (GalleryHall)
# 서버 쪽 타이머 · 알람은 쓰지 않아요. 교대는 누군가 요청할 때 그 자리에서 계산합니다.
name = "mkhz-gallery"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
ALLOWED_ORIGINS = "https://atlasmkhz.github.io,http://localhost:8765,http://127.0.0.1:8765,http://localhost:8000"
# 벽 수 · 한 작품 최소 전시 시간(분) · 자동으로 내리는 신고 수 · 하루에 올릴 수 있는 장 수
SLOTS = "30"
SLOT_MINUTES = "60"
REPORT_LIMIT = "5"
DAILY_UPLOADS = "3"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "ART"
bucket_name = "mkhz-gallery"

[[durable_objects.bindings]]
name = "HALL"
class_name = "GalleryHall"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GalleryHall"]
